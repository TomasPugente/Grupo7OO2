<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulario de empleado')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('publico')}"></nav>

<main class="panel">
    <h1 th:text="${idEmpleado != null
        ? 'Modificar empleado'
        : 'Registrar empleado'}">
    </h1>

    <p th:if="${error}" th:text="${error}"></p>

    <p th:if="${idEmpleado == null}">
        Se generará una contraseña automáticamente y se enviará
        al email ingresado.
    </p>
   
    <form th:object="${staffForm}"
        th:action="${idEmpleado != null}
          ? @{/responsable/empleados/{id}/editar(id=${idEmpleado})}
          : @{/responsable/empleados/nuevo}"
      method="post">

        <div th:if="${#fields.hasErrors('mayorDeEdad')}"
            class="alert alert-danger">
            <strong>Atención:</strong>
            <span th:errors="*{mayorDeEdad}"></span>
        </div>


        <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" th:field="*{nombre}" required>
            <p th:if="${#fields.hasErrors('nombre')}"
               th:errors="*{nombre}"></p>
        </div>

        <div>
            <label for="apellido">Apellido</label>
            <input id="apellido" type="text" th:field="*{apellido}" required>
            <p th:if="${#fields.hasErrors('apellido')}"
               th:errors="*{apellido}"></p>
        </div>
  
        <div>
            <label for="dni">DNI</label>

            <input id="dni"
                type="text"
                th:field="*{dni}"
                inputmode="numeric"
                pattern="[0-9]{8}"
                maxlength="8"
                minlength="8"
                title="Ingresá exactamente 8 números."
                required>

            <p th:if="${#fields.hasErrors('dni')}"
                th:errors="*{dni}"></p>
        </div>

        <div>
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input id="fechaNacimiento" type="date"
                   th:field="*{fechaNacimiento}" required>
            <p th:if="${#fields.hasErrors('fechaNacimiento')}"
               th:errors="*{fechaNacimiento}"></p>
        </div>

        <div>
            <label for="email">Email (usuario de acceso)</label>
            <input id="email" type="email" th:field="*{email}" required>
            <p th:if="${#fields.hasErrors('email')}"
               th:errors="*{email}"></p>
        </div>

        <div>
            <label for="tipoEmpleado">Tipo de empleado</label>

            <select id="tipoEmpleado"
                    th:field="*{tipoEmpleado}"
                    th:disabled="${idEmpleado != null}"
                    required>
                <option value="">Seleccione un tipo</option>
                <option value="Cajero">Cajero</option>
                <option value="Cocinero">Cocinero</option>
            </select>

            <input type="hidden"
                   th:if="${idEmpleado != null}"
                   th:field="*{tipoEmpleado}">
        </div>
        
        <div id="campoTurno">
            <label for="turno">Turno de trabajo</label>

            <select id="turno" th:field="*{turno}">
                <option value="">Seleccione un turno</option>
                <option value="Mañana">Mañana</option>
                <option value="Tarde">Tarde</option>
                <option value="Noche">Noche</option>
            </select>

            <p th:if="${#fields.hasErrors('turno')}"
                th:errors="*{turno}"></p>
        </div>

        <div id="campoEspecialidad">
            <label for="especialidad">Especialidad del cocinero</label>

            <select id="especialidad" th:field="*{especialidad}">
                <option value="">Seleccione una especialidad</option>
                <option value="Cocinero">Cocinero</option>
                <option value="Cocinero ayudante">Cocinero ayudante</option>
                <option value="Lavaplatos">Lavaplatos</option>
            </select>
        </div>

        <div id="campoPlus">
            <label for="plusPorCategoria">Plus por categoría</label>
            <input id="plusPorCategoria"
                 type="text"
                readonly>
        </div>

        <p>El sueldo no se carga en este formulario.</p>

        <div class="acciones">
            <button class="btn" type="submit">Guardar</button>
            <a th:href="@{/responsable/empleados}" class="btn secundario">
                Cancelar
            </a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const tipo = document.getElementById("tipoEmpleado");

    const campoEspecialidad =
        document.getElementById("campoEspecialidad");
    const especialidad =
        document.getElementById("especialidad");

    const campoTurno =
        document.getElementById("campoTurno");
    const turno =
        document.getElementById("turno");

    const campoPlus = document.getElementById("campoPlus");
    const plus = document.getElementById("plusPorCategoria");
    
    function actualizarPlus() {
        const valores = {
            "Cocinero": 150000,
            "Cocinero ayudante": 100000,
            "Lavaplatos": 50000
        };

        const valor = valores[especialidad.value];

        plus.value = valor != null
            ? "$ " + valor.toLocaleString("es-AR")
            : "";
    }



    function actualizarCampos() {
        const esCocinero = tipo.value === "Cocinero";
        const esCajero = tipo.value === "Cajero";

        campoEspecialidad.style.display =
            esCocinero ? "" : "none";
        especialidad.required = esCocinero;

        campoPlus.style.display =
            esCocinero ? "" : "none";

        campoTurno.style.display =
            esCajero ? "" : "none";
        turno.required = esCajero;

        if (!esCocinero) {
            especialidad.value = "";
        }

        if (!esCajero) {
            turno.value = "";
        }
    

        actualizarPlus();
    }

    tipo.addEventListener("change", actualizarCampos);

    especialidad.addEventListener("change", actualizarPlus);

    actualizarCampos();
});

</script>

</body>
</html>

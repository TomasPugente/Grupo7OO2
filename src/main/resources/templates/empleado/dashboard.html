<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('empleado')}"></nav>
<main class="contenedor">

    <h1>Dashboard de <span th:text="${staff.nombre}+ ' '+ ${staff.apellido} "></span></h1>
    <p class="subtitulo">Tu información y tu festival actual.</p>

    <div class="barra-acciones">
        <a class="btn" th:href="@{/empleado/mi-informacion}">Mi información</a>
        <a class="btn" th:href="@{/empleado/sueldos}">Mis sueldos</a>
        <a class="btn" th:href="@{/empleado/festival-actual}">Festival actual</a>


        <form class="separador" th:action="@{/logout}" method="post">
            <button class="btn secundario" type="submit">Cerrar sesión</button>
        </form>
    </div>

    <div class="panel">
        <h2>Hoy trabajás en</h2>
        <div class="fila">
            <div class="dato"><small>Festival</small><strong th:text="${festival.nombre}"></strong></div>
            <div class="dato"><small>Unidad de venta</small><strong th:text="${unidad.nombreComercial}"></strong></div>
            <div class="dato"><small>Período</small><strong th:text="${festival.fechaInicio} + ' al ' + ${festival.fechaFin}"></strong></div>
        </div>
    </div>

    <div class="fila">
        <div class="panel"><div class="dato"><small>Rol</small><strong>Cajero</strong></div></div>
        <div class="panel"><div class="dato"><small>Turno</small><strong>Mañana</strong></div></div>
        <div class="panel"><div class="dato"><small>Antigüedad</small><strong>2 años</strong></div></div>
    </div>

</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>

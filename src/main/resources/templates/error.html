<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('publico')}"></nav>
<main class="contenedor">
<div class="panel error-pagina">
  <p class="error-codigo" th:text="${status} ?: 'Error'">500</p>
  <h1>Algo salió mal</h1>
  <p class="subtitulo" th:text="${message} ?: 'Ocurrió un error inesperado. Probá de nuevo en unos minutos.'">Ocurrió un error inesperado.</p>
  <dl class="error-detalle">
    <dt>Ruta:</dt><dd th:text="${path} ?: '-'">/ruta</dd>
    <dt>Tipo:</dt><dd th:text="${error} ?: '-'">Internal Server Error</dd>
  </dl>
  <div class="acciones" style="justify-content:center;margin-top:1.5rem">
    <a class="btn" th:href="@{/}">Volver al inicio</a>
    <a class="btn secundario" href="javascript:history.back()">Volver atrás</a>
  </div>
</div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>

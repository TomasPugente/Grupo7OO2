<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('publico')}"></nav>
<main class="contenedor">
<div class="contenedor angosto" style="margin-top:0">
<h1>Iniciar sesión</h1>
<p class="subtitulo">Ingresá con tu usuario y contraseña.</p>
<div class="alerta error" th:if="${error != null}">
    Usuario o contraseña incorrectos.
</div>
<div class="alerta" th:if="${logout != null}">
    Cerraste sesión correctamente.
</div>
<form class="panel" method="post" th:action="@{/login}">
  <label for="usuario">Usuario</label>
  <input id="usuario" name="username" type="text" required>
  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" required>
  <button class="btn" type="submit">Ingresar</button>
</form>
</div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>

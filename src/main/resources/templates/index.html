<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Inicio')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar('publico')}"></nav>

<main class="contenedor">

    <h1>Festivales</h1>

    <p class="subtitulo">
        Festivales gastronómicos del predio.
    </p>

    <div class="panel tabla-wrap">

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Temporada</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Unidades de venta</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="festival : ${festivales}">

                    <td>
                        <span th:text="${festival.nombre}"></span>
                    </td>

                    <td>
                        <span th:text="${festival.temporada}"></span>
                    </td>

                    <td>
                        <span th:text="${festival.fechaInicio}"></span>
                    </td>

                    <td>
                        <span th:text="${festival.fechaFin}"></span>
                    </td>

                    <td>
                        <a class="btn"
                            th:if="${esAdmin}"
                            th:href="@{/festivales/{id}/unidades(id=${festival.idFestival})}">
                            Ver unidades
                        </a>
                    </td>

                </tr>
            </tbody>

        </table>

    </div>

    <div class="acciones">
        <a class="btn"
            th:if="${esAdmin}"
            th:href="@{/festivales/reporte-mayores-canon}">
            Unidades con mayor canon
        </a>
        
       <a class="btn"
            th:if="${esResponsable}"
            th:href="@{/responsable/platos}">
            Gestión de platos
        </a>
        
        <a class="btn"
            th:if="${esEmpleado}"
            th:href="@{/responsable/platos}">
            Gestión de pedidos
        </a>
        <a class="btn" 
            th:if="${esAdmin}"
            th:href="@{/pedidos}">
            Registrar unidad de venta
        </a>

<a class="btn secundario"
   sec:authorize="isAnonymous()"
   th:href="@{/login}">
    Iniciar sesión
</a>

<a sec:authorize="isAuthenticated()"
      th:href="@{/logout}"
      method="post"
      class="btn secundario">
    Cerrar sesión
</a>
    </div>

</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>

</body>
</html>

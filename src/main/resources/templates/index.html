<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('Inicio')}"></head>

<body>

<nav th:replace="~{fragments/layout :: navbar('publico')}"></nav>

<main class="contenedor">

    <h1>Festivales</h1>
    <p class="subtitulo">Festivales gastronómicos del predio.</p>

    <div class="barra-acciones">

        <a class="btn"
           th:if="${esResponsable} or ${esEmpleado}"
           th:href="${esResponsable} ? @{/responsable/dashboard} : @{/empleado/dashboard}">
            Dashboard
        </a>

        <a class="btn"
           th:if="${esAdmin}"
           th:href="@{/admin/registrarunidad}">
            Registrar unidad de venta
        </a>

        <a class="btn"
           th:if="${esAdmin}"
           th:href="@{/admin/reporte-mayores-canon}">
            Unidades con mayor canon
        </a>

        <a class="btn" 
            th:if="${esAdmin}"
            th:href="@{/responsable/recaudacion}">Recaudación</a>


        <a class="btn secundario separador"
           sec:authorize="isAnonymous()"
           th:href="@{/login}">
            Iniciar sesión
        </a>

        <form class="separador"
              sec:authorize="isAuthenticated()"
              th:action="@{/logout}" method="post">
            <button class="btn secundario" type="submit">Cerrar sesión</button>
        </form>

    </div>

    <div class="panel tabla-wrap">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Temporada</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th>Unidades de venta</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="festival : ${festivales}">
                    <td th:text="${festival.nombre}"></td>
                    <td th:text="${festival.temporada}"></td>
                    <td th:text="${festival.fechaInicio}"></td>
                    <td th:text="${festival.fechaFin}"></td>
                    <td>
                        <a class="btn chico"
                           th:if="${esAdmin}"
                           th:href="@{/admin/{id}/unidades(id=${festival.idFestival})}">
                            Ver unidades
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<footer th:replace="~{fragments/layout :: pie}"></footer>

</body>
</html>

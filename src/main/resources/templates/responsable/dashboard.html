<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('responsable')}"></nav>
<main class="contenedor">

    <h1>Dashboard del responsable</h1>
    <p class="subtitulo">Resumen de tu unidad de venta.</p>

    <div class="barra-acciones">
        <a class="btn" th:href="@{/responsable/empleados}">Ver empleados</a>
        <a class="btn" th:href="@{/responsable/empleados/nuevo}">Nuevo empleado</a>
        <a class="btn" th:href="@{/responsable/platos}">Ver platos</a>
        <a class="btn" th:href="@{/responsable/platos/nuevo}">Nuevo plato</a>
        <a class="btn" th:href="@{/responsable/reportes}">Reportes</a>
        <a class="btn" th:href="@{/responsable/recaudacion}">Recaudación</a>
        <form class="separador" th:action="@{/logout}" method="post">
            <button class="btn secundario" type="submit">Cerrar sesión</button>
        </form>
    </div>

    <div class="panel">
        <h2>Mi unidad de venta</h2>
        <div class="fila">
            <div class="dato"><small>Nombre comercial</small><strong th:text="${unidad.nombreComercial}"></strong></div>
            <div class="dato"><small>Código</small><strong th:text="${unidad.codigo}"></strong></div>
            <div class="dato"><small>Tipo</small><strong th:text="${unidad.nombreComercial}"></strong></div>
            <div class="dato"><small>Festival</small><strong th:text="${festival.nombre}">Festival del Chocolate</strong></div>
        </div>
    </div>

    <div class="fila">
        <div class="panel"><div class="dato"><small>Recaudación total</small>
        <strong th:text="'$ ' + ${#numbers.formatDecimal(unidad.recaudacion, 1, 'POINT', 2, 'COMMA')}"></strong></div></div>
<div class="panel">
    <div class="dato">
        <small>Canon</small>
        <strong th:text="'$ ' + ${#numbers.formatDecimal(canon, 1, 'POINT', 2, 'COMMA')}"></strong>
    </div>
    </div>        
        <div class="panel"><div class="dato"><small>Rentabilidad neta</small><strong>$ 640.000</strong></div></div>
    </div>

<!--     <div class="panel">
        <h2>Plato estrella</h2>
        <p><strong>Brownie con helado</strong> <span class="etiqueta">320 pedidos</span></p>
    </div> -->

    <div class="panel tabla-wrap">
        <h2>Últimos pedidos</h2>
        <table>
            <thead><tr><th>Fecha</th><th>Estado</th><th class="num">Total</th></tr></thead>
            <tbody>
                <tr th:each="pedido : ${pedidos}">
                    <td th:text="${pedido.fechaTransaccion}"></td>
                    <td th:text="${pedido.estado}"></td>
                    <td class="num" th:text="${pedido.precioTotal}"></td>
                </tr>

            </tbody>
        </table>
    </div>

</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>

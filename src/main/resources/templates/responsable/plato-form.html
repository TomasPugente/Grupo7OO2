<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Plato')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${rolNav})}"></nav>
<main class="contenedor">
<div class="contenedor angosto" style="margin-top:0">

  <h1 th:text="${titulo}">Plato</h1>
  <p class="subtitulo">Completá los datos del plato.</p>

  <form class="panel" method="post" th:action="@{${accion}}" th:object="${plato}">

    <div th:if="${#fields.hasGlobalErrors()}" class="alerta error">
      <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    </div>

    <label for="nombre">Nombre</label>
    <input id="nombre" type="text" th:field="*{nombre}" maxlength="100" required>
    <div class="alerta error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>

    <label for="precioVenta">Precio de venta ($)</label>
    <input id="precioVenta" type="number" step="0.01" min="0.01" th:field="*{precioVenta}" required>
    <div class="alerta error" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></div>

    <label for="costoProduccion">Costo de producción ($)</label>
    <input id="costoProduccion" type="number" step="0.01" min="0" th:field="*{costoProduccion}" required>
    <div class="alerta error" th:if="${#fields.hasErrors('costoProduccion')}" th:errors="*{costoProduccion}"></div>

    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <a class="btn secundario" th:href="@{/responsable/platos}">Cancelar</a>
    </div>
  </form>

</div>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>

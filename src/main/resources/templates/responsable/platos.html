<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Platos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar(${rolNav})}"></nav>
<main class="contenedor">

  <div class="fila-ordenamiento">
    <div>
      <h1>Platos</h1>
      <p class="subtitulo">Menú de la unidad de venta.</p>
    </div>
    <a class="btn" th:href="@{/responsable/platos/nuevo}">Agregar plato</a>
  </div>

  <div th:if="${exito}" class="alerta ok" th:text="${exito}"></div>

    <form class="panel" method="get" th:action="@{/responsable/platos}" th:object="${filtro}">
    <h2>Filtrar platos</h2>

    <div th:if="${#fields.hasGlobalErrors()}" class="alerta error">
      <div th:each="e : ${#fields.globalErrors()}" th:text="${e}"></div>
    </div>

    <div class="fila">
      <div>
        <label for="f-nombre">Nombre</label>
        <input id="f-nombre" type="text" th:field="*{nombre}" placeholder="Ej: empanada">
      </div>
      <div>
        <label for="f-pmin">Precio mínimo ($)</label>
        <input id="f-pmin" type="number" step="0.01" min="0" th:field="*{precioMin}">
        <div class="alerta error" th:if="${#fields.hasErrors('precioMin')}" th:errors="*{precioMin}"></div>
      </div>
      <div>
        <label for="f-pmax">Precio máximo ($)</label>
        <input id="f-pmax" type="number" step="0.01" min="0" th:field="*{precioMax}">
        <div class="alerta error" th:if="${#fields.hasErrors('precioMax')}" th:errors="*{precioMax}"></div>
      </div>
    </div>
    <div class="fila">
      <div>
        <label for="f-cmin">Costo mínimo ($)</label>
        <input id="f-cmin" type="number" step="0.01" min="0" th:field="*{costoMin}">
        <div class="alerta error" th:if="${#fields.hasErrors('costoMin')}" th:errors="*{costoMin}"></div>
      </div>
      <div>
        <label for="f-cmax">Costo máximo ($)</label>
        <input id="f-cmax" type="number" step="0.01" min="0" th:field="*{costoMax}">
        <div class="alerta error" th:if="${#fields.hasErrors('costoMax')}" th:errors="*{costoMax}"></div>
      </div>
    </div>

    <div class="acciones">
      <button class="btn" type="submit">Filtrar</button>
      <a class="btn secundario" th:href="@{/responsable/platos}">Limpiar</a>
    </div>
  </form>

  <div class="panel tabla-wrap">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th class="num">Precio de venta</th>
          <th class="num">Costo de producción</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(platos)}">
          <td colspan="4" th:text="${hayFiltros} ? 'Ningún plato coincide con el filtro.' : 'Todavía no hay platos cargados.'">
        
          </td>
        </tr>
        <tr th:each="p : ${platos}">
          <td th:text="${p.nombre}"></td>
          <td class="num" th:text="${'$ ' + #numbers.formatDecimal(p.precioVenta, 1, 'POINT', 2, 'COMMA')}"></td>
          <td class="num" th:text="${'$ ' + #numbers.formatDecimal(p.costoProduccion, 1, 'POINT', 2, 'COMMA')}"></td>
          <td>
            <div class="acciones">
              <a class="btn chico secundario" th:href="@{/responsable/platos/{id}/editar(id=${p.id})}">Modificar</a>
              <form th:action="@{/responsable/platos/{id}/eliminar(id=${p.id})}" method="post"
                    onsubmit="return confirm('¿Eliminar este plato?');">
                <button class="btn chico peligro" type="submit">Eliminar</button>
              </form>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
